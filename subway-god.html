<style>

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.small{font-size:13px;color:var(--mute)}

.head:before{content:"";position:absolute;left:29px;top:-12px;width:4px;height:12px;background:#7fd6c2}
.head:after{content:"";position:absolute;left:25px;top:-18px;width:12px;height:12px;border-radius:50%;background:#ff8fa3;animation:pulse 1.6s infinite}
.face{position:absolute;inset:9px 8px;border-radius:14px;background:#1d2a3a;display:flex;justify-content:center;gap:10px;padding-top:9px}
.eye{width:9px;height:12px;border-radius:5px;background:#6ff0ff;animation:blink 4s infinite;transform-origin:center}
.mouth{position:absolute;left:50%;bottom:5px;width:14px;height:6px;margin-left:-7px;border-bottom:3px solid #6ff0ff;border-radius:0 0 12px 12px}
#bot.worry .mouth{border-bottom:0;border-top:3px solid #ffd166;border-radius:12px 12px 0 0;bottom:6px}
#bot.worry .eye{background:#ffd166;height:14px}
#bot.panic .mouth{border:3px solid #ff6b6b;border-radius:50%;width:10px;height:10px;margin-left:-5px;bottom:3px}

@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.btns{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;background:#2b6ef2;color:#fff;padding:6px 12px;font-weight:600}

.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:5px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--p);font-weight:600}

#scr .card{max-width:520px;width:100%;max-height:92vh;overflow:auto}
#scr h1{margin:0 0 4px;font-size:34px}
.lvs{display:grid;gap:8px;margin:12px 0}
.lv{display:flex;justify-content:space-between;align-items:center;text-align:left;border:2px solid var(--rule);border-radius:12px;background:transparent;color:var(--ink);padding:8px 12px}
.lv:disabled{opacity:.45;cursor:default}
@media(max-width:760px){#hud{width:175px}.nb{grid-template-columns:56px 1fr 32px}#bot{width:195px}.head{width:44px;height:40px}.face{inset:6px 5px;gap:6px;padding-top:6px}.eye{width:6px;height:9px}#say{font-size:12px}}
@media(prefers-reduced-motion:reduce){.eye,.head:after{animation:none}}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:8px}.btn.gray{background:#5d6b7d}

.lb .m{font-size:11px;opacity:.8}.lb.sad .m{color:#ef5350;opacity:1;font-weight:700}

#scr .card{max-width:680px}
.wmap{position:relative;height:340px;border-radius:14px;overflow:hidden;background:#bccbd0}
.pin{position:absolute;transform:translate(-50%,-50%);width:132px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--p);border:2px solid var(--rule);border-radius:12px;padding:6px;color:var(--ink);text-align:center;font-size:13px}
.pin:disabled{opacity:.6;cursor:default}.pin .ic{font-size:26px}

@media(max-width:760px){#hud{width:175px}.nb{grid-template-columns:44px 1fr 76px;font-size:10px}.nb.r2{grid-template-columns:56px 1fr 30px}.lb{font-size:12px}.lb .q{font-size:14px}#emg{font-size:14px;padding:8px 12px}}
#adm{display:none;position:absolute;left:10px;bottom:46px;z-index:6;max-width:250px;flex-wrap:wrap;gap:5px;align-items:center;padding:8px}body.adm.play #adm{display:flex}#adm select{font:inherit;font-size:12px;border-radius:8px;padding:2px}.pin.rs{border-color:#2b6ef2}.bl{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font:700 12px Helvetica,Arial,sans-serif;vertical-align:middle;margin-left:2px}
.btn.big{padding:12px;font-size:18px;border-radius:12px}
.lb{background:#141414;color:#fff;font-family:Helvetica,Arial,sans-serif}.lb .q{background:#fff;color:#111}.lb .bl{width:18px;height:18px;font-size:11px}
#tkl span{gap:4px}</style>
</head>

  <div class="seg" role="group" aria-label="Dispatcher goal"><button id="m-avg" aria-pressed="true">Fastest average</button><button id="m-fair" aria-pressed="false">Fair to all</button></div>

</div>
<div id="adm" class="card"><b>Admin</b><button class="btn sm gray" id="a-money">+$1M</button><button class="btn sm gray" id="a-clear">Clear meter</button><button class="btn sm gray" id="a-fix">Fix all</button><button class="btn sm gray" id="a-skip">Skip 60s</button><select id="a-ev"></select><button class="btn sm gray" id="a-spawn">Spawn</button></div><button id="emg" class="btn">🚨 EMERGENCY FIX · $350k</button><div id="toast" role="status"></div>

    });
    var sv=G.chaos<30?['Good Service','#00933c','#fff']:G.chaos<70?['Delays','#fccc0a','#000']:['Service Suspended','#ee352e','#fff'],se=$('#svc');if(se.dataset.s!==sv[0]){se.dataset.s=sv[0];se.innerHTML='<span class="bl" style="background:'+sv[1]+';color:'+sv[2]+'">●</span> '+sv[0]}$('#clock').textContent=fmt(TIME-G.t);
    $('#chaos').style.width=G.chaos+'%';
    $('#crews').textContent='Crews '+'●'.repeat(Math.min(G.crews,8))+'○'.repeat(Math.max(0,G.maxc-G.crews));
    $('#money').textContent=mny(G.money);$('#emg').disabled=G.money<350000;
    $('#fair').textContent=Math.round(w2.fair);var rw=risks();for(var e9 in rw){$('#rk-'+e9).style.width=rw[e9]*100+'%';$('#rv-'+e9).textContent=Math.round(rw[e9]*100)+'%'}$('#gro').textContent='Ridership +'+Math.round(60*G.t/TIME)+'% and rising';$('#aiu').textContent='Bot actions: '+G.ai+' / 10 (5th star)';
    var worst=null,wv=0;
    for(var id3 in S){var v=w2.by[id3];if(v>wv){wv=v;worst=id3}$('#b-'+id3).style.width=Math.min(100,v/60*100)+'%';$('#v-'+id3).textContent='👥'+S[id3].q.length+' ♥'+Math.round(S[id3].m)+' '+Math.round(v)+'s'}
    $('#alert').textContent=(worst&&w2.avg>1&&wv>w2.avg*1.8&&wv>20)?S[worst].name+' waits '+(wv/w2.avg).toFixed(1)+'x longer than average.':'';

  }
  var cx=tgt.x+Math.sin(ang)*dist*.62,cz=tgt.z+Math.cos(ang)*dist*.62;
