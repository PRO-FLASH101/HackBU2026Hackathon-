<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subway God</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--p:rgba(255,255,255,.92);--ink:#1d2a3a;--mute:#5d6b7d;--rule:rgba(29,42,58,.15);--bg:#cdeedd;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:rgba(24,32,44,.92);--ink:#eef3f8;--mute:#9fb0c3;--rule:rgba(255,255,255,.16);--bg:#0e1319}}
:root[data-theme="dark"]{--p:rgba(24,32,44,.92);--ink:#eef3f8;--mute:#9fb0c3;--rule:rgba(255,255,255,.16);--bg:#0e1319}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Fredoka,system-ui,sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.card{background:var(--p);border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#hud{z-index:5;position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top,0px));width:250px}
#hud h2{margin:0;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:8px;background:var(--rule);overflow:hidden;margin:4px 0 8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fcf80,#f5c542,#ef5350);background-size:250px 100%;border-radius:8px}
.small{font-size:13px;color:var(--mute)}
.nb{display:grid;grid-template-columns:70px 1fr 38px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.nb .bar{height:9px;border-radius:6px;background:var(--rule);overflow:hidden}.nb .bar i{display:block;height:100%}
.nb b{text-align:right;font-variant-numeric:tabular-nums}
#alert{margin-top:6px;font-size:13px;font-weight:600;color:#d93636}
#bot{z-index:5;position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top,0px));width:270px}
#bot .top{display:flex;gap:10px;align-items:center}
.head{position:relative;width:62px;height:54px;border-radius:20px;background:linear-gradient(#b9f0e0,#7fd6c2);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.head:before{content:"";position:absolute;left:29px;top:-12px;width:4px;height:12px;background:#7fd6c2}
.head:after{content:"";position:absolute;left:25px;top:-18px;width:12px;height:12px;border-radius:50%;background:#ff8fa3;animation:pulse 1.6s infinite}
.face{position:absolute;inset:9px 8px;border-radius:14px;background:#1d2a3a;display:flex;justify-content:center;gap:10px;padding-top:9px}
.eye{width:9px;height:12px;border-radius:5px;background:#6ff0ff;animation:blink 4s infinite;transform-origin:center}
.mouth{position:absolute;left:50%;bottom:5px;width:14px;height:6px;margin-left:-7px;border-bottom:3px solid #6ff0ff;border-radius:0 0 12px 12px}
#bot.worry .mouth{border-bottom:0;border-top:3px solid #ffd166;border-radius:12px 12px 0 0;bottom:6px}
#bot.worry .eye{background:#ffd166;height:14px}
#bot.panic .mouth{border:3px solid #ff6b6b;border-radius:50%;width:10px;height:10px;margin-left:-5px;bottom:3px}
#bot.panic .eye{background:#ff6b6b;height:16px;width:11px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.35)}}
#say{font-size:14px;font-weight:600;line-height:1.3}
.btns{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;background:#2b6ef2;color:#fff;padding:6px 12px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;border:2px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:5px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--p);font-weight:600}
button:focus-visible{outline:3px solid #2b6ef2;outline-offset:2px}
.lb{position:absolute;left:0;top:0;display:flex;gap:4px;align-items:center;background:var(--p);border:3px solid;border-radius:10px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;will-change:transform}
.lb .q{background:var(--ink);color:var(--p);border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
.lb.hot .q{background:#ef5350;color:#fff}.lb.closed{background:#ef5350;color:#fff}.lb.closed .q{background:#fff;color:#c62828}
#toast{z-index:6;position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:22px;font-weight:700;color:#fff;background:#e0523f;border-radius:14px;padding:6px 18px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
#hint{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;background:var(--p);border-radius:10px;padding:3px 10px;color:var(--mute);text-align:center;max-width:92vw}
#scr{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,20,30,.55);padding:14px}
#scr .card{max-width:520px;width:100%;max-height:92vh;overflow:auto}
#scr h1{margin:0 0 4px;font-size:34px}
.lvs{display:grid;gap:8px;margin:12px 0}
.lv{display:flex;justify-content:space-between;align-items:center;text-align:left;border:2px solid var(--rule);border-radius:12px;background:transparent;color:var(--ink);padding:8px 12px}
.lv:disabled{opacity:.45;cursor:default}
@media(max-width:760px){#hud{width:175px}.nb{grid-template-columns:56px 1fr 32px}#bot{width:195px}.head{width:44px;height:40px}.face{inset:6px 5px;gap:6px;padding-top:6px}.eye{width:6px;height:9px}#say{font-size:12px}}
@media(prefers-reduced-motion:reduce){.eye,.head:after{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" class="card">
  <div class="row"><h2 id="town">Town</h2><span id="clock">0:00</span></div>
  <div class="small">Catastrophe meter</div>
  <div class="meter"><i id="chaos"></i></div>
  <div class="small" id="crews"></div>
  <div class="row" style="margin-top:6px"><b>Fairness</b><b id="fair" style="font-size:20px">100</b></div>
  <div id="nbs"></div>
  <div id="alert"></div>
</div>
<div id="bot" class="card">
  <div class="top">
    <div class="head"><div class="face"><b class="eye"></b><b class="eye"></b><u class="mouth"></u></div></div>
    <div id="say">Hi! I’m Dispatch Bot.</div>
  </div>
  <div class="seg" role="group" aria-label="Dispatcher goal"><button id="m-avg" aria-pressed="true">Fastest average</button><button id="m-fair" aria-pressed="false">Fair to all</button></div>
  <div class="btns"><button class="btn" id="accept">Do it</button><label class="small"><input type="checkbox" id="auto"> Let the bot drive</label></div>
</div>
<div id="toast" role="status"></div>
<div id="hint">Drag to turn the map, scroll to zoom. Tap a train to switch its line. Tap a closed station tag or a broken train to spend a repair crew.</div>
<div id="scr"><div class="card" id="scrc"></div></div>
<script>
(function(){
var T=THREE;
function $(s){return document.querySelector(s)}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+('0'+t%60).slice(-2)}
var NB={dt:['Downtown',0xe9a23b,'#e9a23b'],hl:['Hillside',0x4caf7a,'#4caf7a'],hb:['Harbor',0x4a90d9,'#4a90d9'],ng:['Northgate',0xe06377,'#e06377']};
var ST={W2:['Hillside West','hl',-10,3,1.2],W1:['Hillside North','hl',-5,1,1.4],H:['Central','dt',0,0,3],D1:['Market Street','dt',5,1,2],E1:['Harbor Docks','hb',8,5,1.8],E2:['Harbor Point','hb',11,8,1.5],N1:['Northgate Mill','ng',-1,-5,.6],N2:['Northgate Park','ng',-1,-10,.5]};
var LV=[
{n:'Maple Meadows',t:120,A:'W1 H D1',B:'N1 H',tr:[2,1],g:[14,20],ev:['br','cr'],k:.8,c:0x8fcf6a,sky:0xcdeedd},
{n:'Harbor Bay',t:150,A:'W1 H D1 E1',B:'N1 H',tr:[3,1],g:[12,18],ev:['br','cr','fl'],k:1,c:0xe6d38a,sky:0xbfe3f5},
{n:'Hillside Heights',t:180,A:'W2 W1 H D1 E1',B:'N2 N1 H',tr:[3,2],g:[10,16],ev:['br','cr','fl','cl'],k:1.1,c:0xd9a65b,sky:0xf3dcb8},
{n:'Fault Line City',t:240,A:'W2 W1 H D1 E1 E2',B:'N2 N1 H',tr:[4,2],g:[9,14],ev:['br','cr','fl','cl','eq'],k:1.2,c:0xb9b3a4,sky:0xd8d4cc},
{n:'Metropolis',t:300,A:'W2 W1 H D1 E1 E2',B:'N2 N1 H',tr:[4,3],g:[7,12],ev:['br','cr','fl','cl','eq'],k:1.3,c:0x9aa7bd,sky:0x9db0d6}];
var LC={A:0x2fb5a9,B:0x9b6be0},LN={A:'Line A',B:'Line B'},V=2;
var prog={open:1,stars:[0,0,0,0,0]};
try{var sv=JSON.parse(localStorage.getItem('sg3d'));if(sv&&sv.open)prog=sv}catch(e){}
function save(){try{localStorage.setItem('sg3d',JSON.stringify(prog))}catch(e){}}

// ---- three setup
var ren=new T.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;
$('#stage').appendChild(ren.domElement);
var scene=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.5,200),root=null,mats={};
scene.add(new T.HemisphereLight(0xffffff,0x8a9a7a,.85));
var sun=new T.DirectionalLight(0xfff2d8,.75);sun.position.set(-12,22,10);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);var sc=sun.shadow.camera;sc.left=-22;sc.right=22;sc.top=22;sc.bottom=-22;sc.far=70;
scene.add(sun);
var ang=0,dist=30,tgt=new T.Vector3(.5,0,-1),shake=0;
function mat(c){return mats[c]||(mats[c]=new T.MeshLambertMaterial({color:c}))}
function M(g,c,x,y,z,p){var m=new T.Mesh(g,typeof c==='object'?c:mat(c));m.position.set(x||0,y||0,z||0);m.castShadow=m.receiveShadow=true;(p||root).add(m);return m}
function BX(w,h,d){return new T.BoxGeometry(w,h,d)}
function tm(c,o){return new T.MeshLambertMaterial({color:c,transparent:true,opacity:o})}
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
var seed=1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}

// ---- game state
var S={},L={},G=null,mode='avg',tEl=[],lab={},sObj={};
function build(lv){
  if(root)scene.remove(root);
  root=new T.Group();scene.add(root);
  scene.background=new T.Color(lv.sky);scene.fog=new T.Fog(lv.sky,40,85);
  var dirt=mat(0x8a5a3a),top=mat(lv.c);
  var g=new T.Mesh(BX(31,1.4,29),[dirt,dirt,top,dirt,dirt,dirt]);g.position.set(.5,-.7,-1);g.receiveShadow=true;root.add(g);
  L={A:lv.A.split(' '),B:lv.B.split(' ')};S={};
  var ids={};for(var l in L)L[l].forEach(function(i){ids[i]=1});
  for(var id in ids){var d=ST[id];S[id]={id:id,name:d[0],n:d[1],x:d[2],z:d[3],rate:d[4]*lv.k,q:[],closed:0,kind:'',acc:0,sib:null}}
  for(var a in S)for(var b in S)if(a!==b&&S[a].n===S[b].n)S[a].sib=b;
  seed=7+lv.t;
  var segs=[];
  for(var ln in L){var pts=L[ln];for(var i=0;i<pts.length-1;i++){
    var p=S[pts[i]],q=S[pts[i+1]],dx=q.x-p.x,dz=q.z-p.z,d2=Math.hypot(dx,dz),r=-Math.atan2(dz,dx),nx=-dz/d2*.3,nz=dx/d2*.3;
    segs.push([p,q]);
    var bed=M(BX(d2,.14,1.1),0x6b6f78,(p.x+q.x)/2,.07,(p.z+q.z)/2);bed.rotation.y=r;
    var st=M(BX(d2,.04,.2),LC[ln],(p.x+q.x)/2,.16,(p.z+q.z)/2);st.rotation.y=r;
    for(var s=-1;s<=1;s+=2){var rl=M(BX(d2,.1,.07),0xdfe4ea,(p.x+q.x)/2+nx*s,.18,(p.z+q.z)/2+nz*s);rl.rotation.y=r}
  }}
  // decor
  function far(x,z,m){for(var k=0;k<segs.length;k++){var p=segs[k][0],q=segs[k][1],vx=q.x-p.x,vz=q.z-p.z,t=Math.max(0,Math.min(1,((x-p.x)*vx+(z-p.z)*vz)/(vx*vx+vz*vz))),dd=Math.hypot(x-p.x-vx*t,z-p.z-vz*t);if(dd<m)return false}return true}
  var city=lv.n==='Fault Line City'||lv.n==='Metropolis';
  for(var n=0,tries=0;n<(city?26:34)&&tries<400;tries++){
    var x=-14+rnd()*29,z=-14.5+rnd()*27;if(!far(x,z,3.2))continue;n++;
    if(city){var h=1.5+rnd()*(lv.n==='Metropolis'?4.5:2.5);M(BX(1.6,h,1.6),[0xdfe6ee,0xc9d3df,0xf1d9b5][n%3],x,h/2,z);M(BX(1.2,.1,1.2),0x8892a0,x,h+.05,z)}
    else if(n%4===0){M(BX(1.5,1,1.3),0xf4e4c8,x,.5,z);var rf=M(new T.ConeGeometry(1.2,.9,4),0xc8553d,x,1.45,z);rf.rotation.y=Math.PI/4}
    else{M(new T.CylinderGeometry(.12,.16,.7,6),0x7a5230,x,.35,z);M(new T.ConeGeometry(.7,1.5,7),n%3?0x3f9a4a:0xd98a2b,x,1.4,z)}
  }
  if(lv.n==='Maple Meadows')for(var f=0;f<4;f++)M(BX(3,.05,2),f%2?0xe4c35a:0x6fb35a,-9+f*0,.03,f*0+8-f*3.5+5).position.set(-10+f*2.2,.03,9-f*.2);
  if(lv.n==='Harbor Bay')M(BX(12,.06,6),0x59a8e8,8,.04,-8).rotation.y=.3;
  // stations
  sObj={};var lb=document.querySelectorAll('.lb');lb.forEach(function(n){n.remove()});lab={};
  for(var id2 in S){
    var s2=S[id2],lnx=L.A.indexOf(id2)>=0?L.A:L.B,ix=lnx.indexOf(id2),nb=S[lnx[ix+1<lnx.length?ix+1:ix-1]],a2=-Math.atan2(nb.z-s2.z,nb.x-s2.x);
    var grp=new T.Group();grp.position.set(s2.x,0,s2.z);grp.rotation.y=a2;root.add(grp);
    M(BX(3.6,.3,2.3),NB[s2.n][1],0,.15,0,grp);M(BX(3.6,.05,.12),0xf5d64a,0,.31,1.0,grp);M(BX(3.6,.05,.12),0xf5d64a,0,.31,-1.0,grp);
    M(BX(1.3,.9,1),0xfdf3e1,0,.75,1.9,grp);var rf2=M(new T.ConeGeometry(1.2,.7,4),NB[s2.n][1],0,1.55,1.9,grp);rf2.rotation.y=Math.PI/4;
    var people=[];
    for(var i2=0;i2<14;i2++){var pg=new T.Group();pg.position.set(-1.5+((i2*37+s2.x*5+99)%100)/100*3,.3,-.8+((i2*61+s2.z*7+99)%100)/100*1.6);
      M(new T.CylinderGeometry(.11,.14,.4,8),[0xe4572e,0xf3a712,0x29b6f6,0x8bc34a,0xab47bc,0xfafafa,0x26a69a][i2%7],0,.2,0,pg);M(new T.SphereGeometry(.13,8,6),0xf1c27d,0,.52,0,pg);grp.add(pg);pg.visible=false;people.push(pg)}
    var water=new T.Mesh(new T.CylinderGeometry(2.8,2.8,.8,24),tm(0x3a8dde,.62));water.position.y=.4;grp.add(water);water.visible=false;
    var bar=new T.Group();grp.add(bar);bar.visible=false;
    for(var k2=0;k2<4;k2++)M(BX(.5,.35,.12),k2%2?0xffffff:0xe53935,-.8+k2*.5,.7,1.1,bar);
    M(new T.ConeGeometry(.2,.5,8),0xff7a1a,-1.7,.55,1.1,bar);M(new T.ConeGeometry(.2,.5,8),0xff7a1a,1.7,.55,1.1,bar);
    var cr=new T.Group();grp.add(cr);cr.visible=false;
    for(var c2=0;c2<5;c2++){var ck=M(BX(2.4,.05,.12),0x2b2f3a,0,.33+c2*.001,0,cr);ck.rotation.y=-.9+c2*.45;ck.position.set(-.6+c2*.3,.33,(c2%2?.3:-.3))}
    var al=new T.Group();al.position.y=3;grp.add(al);al.visible=false;
    M(new T.CylinderGeometry(.14,.1,.7,8),0xef5350,0,.45,0,al);M(new T.SphereGeometry(.16,8,6),0xef5350,0,-.05,0,al);
    sObj[id2]={people:people,water:water,bar:bar,cr:cr,al:al};
    var d3=document.createElement('div');d3.className='lb';d3.style.borderColor=NB[s2.n][2];d3.innerHTML='<span></span><span class="q"></span>';d3.firstChild.textContent=s2.name;
    document.body.appendChild(d3);lab[id2]=d3;(function(id){d3.addEventListener('click',function(){fix(id)})})(id2);
  }
  // trains
  tEl=[];var tn=0;
  ['A','B'].forEach(function(line,li){for(var i3=0;i3<lv.tr[li];i3++){
    tn++;var tr={id:tn,line:line,p:i3*(L[line].length-1)/lv.tr[li],dir:1,down:0,last:-1,vis:-1};
    var tg=new T.Group();root.add(tg);tr.mats=[];
    for(var c3=0;c3<3;c3++){var bm=new T.MeshLambertMaterial({color:LC[line]});tr.mats.push(bm);M(BX(1.7,.8,.9),bm,-c3*1.85,.4,0,tg);M(BX(1.7,.1,.95),0x31404f,-c3*1.85,.85,0,tg);M(BX(1.2,.25,.93),0xcdeefa,-c3*1.85,.5,0,tg)}
    M(BX(.1,.18,.5),0xfff3a0,.86,.35,0,tg);
    var cv=document.createElement('canvas');cv.width=cv.height=64;var cc=cv.getContext('2d');cc.fillStyle='#fff';cc.beginPath();cc.arc(32,32,28,0,7);cc.fill();cc.fillStyle='#1d2a3a';cc.font='bold 40px sans-serif';cc.textAlign='center';cc.fillText(tn,32,46);
    var sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv)}));sp.scale.set(.9,.9,1);sp.position.set(0,1.5,0);tg.add(sp);
    var hit=new T.Mesh(BX(5.6,1.6,1.8),new T.MeshBasicMaterial({visible:false}));hit.position.set(-1.8,.7,0);hit.userData.tr=tr;tg.add(hit);tr.hit=hit;
    var bc=M(new T.SphereGeometry(.2,8,6),0xff3b30,0,1.1,0,tg);bc.visible=false;tr.bc=bc;tr.smoke=[];
    for(var k3=0;k3<3;k3++){var sm=new T.Mesh(new T.SphereGeometry(.28,8,6),tm(0x9aa0a6,.6));sm.visible=false;tg.add(sm);tr.smoke.push(sm)}
    tr.g=tg;tEl.push(tr);
  }});
  return tEl;
}
function init(i){
  var lv=LV[i];var trs=build(lv);
  G={i:i,lv:lv,t:0,over:false,crews:3,crewT:0,next:6,trains:trs,hist:{},fs:0,fn:0,chaos:0,peak:0,sug:null,sugT:0,quake:0,pend:null,say:'',sayT:0,first:true,pk:0};
  for(var id in S){G.hist[S[id].n]=[]}
  var nbh=$('#nbs');nbh.innerHTML='';
  Object.keys(G.hist).forEach(function(k){nbh.insertAdjacentHTML('beforeend','<div class="nb"><span>'+NB[k][0]+'</span><div class="bar"><i id="b-'+k+'" style="background:'+NB[k][2]+'"></i></div><b id="v-'+k+'">0s</b></div>')});
  $('#town').textContent=lv.n;$('#scr').style.display='none';
  speak('Welcome to '+lv.n+'! Keep every neighborhood moving.',5);
  suggest();
}
function speak(t,s){G.say=t;G.sayT=s}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},2600)}

// ---- simulation
function board(t,id){var s=S[id];if(s.closed>0)return;var n=Math.min(25,s.q.length);for(var i=0;i<n;i++){var a=s.q.shift();G.hist[s.n].push({t:G.t,w:G.t-a})}}
function step(dt){
  G.t+=dt;
  for(var id in S){var s=S[id];s.acc+=s.rate*dt*(.7+Math.random()*.6);while(s.acc>=1){s.acc--;var tg=(s.closed>0&&S[s.sib]&&S[s.sib].closed<=0)?S[s.sib]:s;tg.q.push(G.t)}if(s.closed>0)s.closed-=dt}
  if(G.quake>0){G.quake-=dt;if(G.quake<=0&&G.pend){G.pend();G.pend=null}}
  G.trains.forEach(function(t){
    if(t.down>0){t.down-=dt;return}
    if(G.quake>0)return;
    var pts=L[t.line],len=pts.length-1,j=Math.max(0,Math.min(Math.floor(t.p),len-1)),a=S[pts[j]],b=S[pts[j+1]],d=Math.hypot(b.x-a.x,b.z-a.z);
    t.p+=t.dir*V*dt/d;
    if(t.p>=len){t.p=len;t.dir=-1}if(t.p<=0){t.p=0;t.dir=1}
    var r=Math.round(t.p);if(r!==t.last&&Math.abs(t.p-r)<.1){t.last=r;board(t,pts[r])}
  });
  G.next-=dt;if(G.next<=0){spawn();G.next=G.lv.g[0]+Math.random()*(G.lv.g[1]-G.lv.g[0])}
  if(G.crews<3){G.crewT+=dt;if(G.crewT>=15){G.crews++;G.crewT=0}}
  G.sugT-=dt;if(G.sugT<=0){suggest();if($('#auto').checked&&G.sug)apply(G.sug,true)}
  if(G.sayT>0)G.sayT-=dt;
}
function close(s,sec,kind){if(s.closed<=0){s.closed=sec;s.kind=kind}}
function spawn(){
  var ids=Object.keys(S),s=S[ids[Math.floor(Math.random()*ids.length)]],ev=G.lv.ev,e=ev[Math.floor(Math.random()*ev.length)];
  var ok=G.trains.filter(function(t){return t.down<=0});
  if(G.first){e='br';G.first=false}
  if(e==='br'&&ok.length){var t=ok[Math.floor(Math.random()*ok.length)];t.down=16;toast('Train '+t.id+' broke down!');speak('Train '+t.id+' broke down! A crew can fix it fast.',5)}
  else if(e==='fl'){close(s,20,'fl');toast('Flooding at '+s.name+'!');speak(s.name+' is flooding. Passengers will shift to the nearby stop.',5)}
  else if(e==='cl'){close(s,15,'cl');toast(s.name+' closed');speak(s.name+' is closed for an emergency.',5)}
  else if(e==='eq'){G.quake=4;toast('EARTHQUAKE!');speak('Earthquake! All trains halt. Hold on!',5);G.pend=function(){close(S[ids[Math.floor(Math.random()*ids.length)]],18,'eq');toast('Quake damage: a station is closed')}}
  else{for(var i=0;i<35;i++)s.q.push(G.t);toast('Crowd surge at '+s.name+'!');speak('Big crowd at '+s.name+'! Send trains its way.',5)}
}
function waits(){
  var out={},ts=0,tn=0,vals=[];
  for(var k in G.hist){
    G.hist[k]=G.hist[k].filter(function(h){return h.t>G.t-45});
    var sum=0,n=0;G.hist[k].forEach(function(h){sum+=h.w;n++});
    for(var id in S)if(S[id].n===k)S[id].q.forEach(function(a){sum+=G.t-a;n++});
    out[k]=n?sum/n:0;ts+=sum;tn+=n;vals.push(out[k]);
  }
  var mx=Math.max.apply(null,vals),m=vals.reduce(function(a,b){return a+b},0)/vals.length;
  return {by:out,avg:tn?ts/tn:0,n:tn,mx:mx,fair:mx>1?Math.min(1,m/mx)*100:100};
}
// ---- dispatcher
function cnt(l){return G.trains.filter(function(t){return t.line===l&&t.down<=0}).length}
function pressure(l,wt){var p=0;L[l].forEach(function(id){var s=S[id];if(s.closed>0)return;p+=s.q.length*wt[s.n]*(id==='H'?.5:1)});return p}
function cost(pa,pb,ka,kb){return pa/Math.max(.5,ka)+pb/Math.max(.5,kb)}
function suggest(){
  G.sugT=3;var w=waits(),wt={};
  for(var k in G.hist)wt[k]=mode==='fair'&&w.avg>1?Math.pow(Math.min(4,Math.max(.5,w.by[k]/w.avg)),1.5):1;
  var pa=pressure('A',wt),pb=pressure('B',wt),ka=cnt('A'),kb=cnt('B'),why=mode==='fair'?'Protects the neighborhood waiting longest.':'Clears the most riders per minute.',best=null;
  if(G.crews>0){
    var c=[];
    for(var id in S)if(S[id].closed>0)c.push({kind:'st',id:id,sc:30+S[id].q.length*wt[S[id].n],text:'Send a repair crew to '+S[id].name+'.'});
    G.trains.forEach(function(t){if(t.down>0)c.push({kind:'tr',t:t,sc:30+(t.line==='A'?pa:pb),text:'Send a repair crew to Train '+t.id+'.'})});
    c.sort(function(a,b){return b.sc-a.sc});if(c.length){best=c[0];best.why=why}
  }
  if(!best){
    var bc=cost(pa,pb,ka,kb)*.92,bt=null;
    G.trains.forEach(function(t){
      if(t.down>0)return;var f=t.line,kf=cnt(f);if(mode==='fair'&&kf<=1)return;
      var cc=cost(pa,pb,f==='A'?ka-1:ka+1,f==='A'?kb+1:kb-1);if(cc<bc){bc=cc;bt=t}
    });
    if(bt)best={kind:'sw',t:bt,text:'Move Train '+bt.id+' to '+(bt.line==='A'?LN.B:LN.A)+'.',why:why};
  }
  G.sug=best;
}
function apply(s,quiet){
  if(!s)return;
  if(s.kind==='st'){fix(s.id)}else if(s.kind==='tr'){fixT(s.t)}else sw(s.t);
  if(quiet)speak('I moved things around!',3);
  suggest();
}
function sw(t){t.line=t.line==='A'?'B':'A';t.p=L[t.line].indexOf('H');t.last=t.p;t.dir=1}
function fix(id){var s=S[id];if(s.closed>0){if(G.crews>0){G.crews--;s.closed=0}else toast('No repair crews left')}}
function fixT(t){if(t.down>0){if(G.crews>0){G.crews--;t.down=0}else toast('No repair crews left')}}

// ---- end of level
function finish(win){
  G.over=true;var fa=G.fn?G.fs/G.fn:100,stars=0;
  if(win){stars=fa>=70&&G.peak<60?3:fa>=50?2:1;prog.stars[G.i]=Math.max(prog.stars[G.i],stars);if(G.i+1<LV.length)prog.open=Math.max(prog.open,G.i+2);save()}
  var h=win?'<h1>Town saved!</h1><p>'+G.lv.n+' kept moving. '+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</p>':'<h1>Catastrophe!</h1><p>The city ground to a halt in '+G.lv.n+'.</p>';
  h+='<p class="small">Average fairness '+Math.round(fa)+' out of 100. Peak catastrophe meter '+Math.round(G.peak)+'%.'+(win&&stars<3?' Keep every neighborhood served for 3 stars.':'')+'</p><div class="btns"><button class="btn" id="re">Try again</button>'+(win&&G.i+1<LV.length?'<button class="btn" id="nx">Next town</button>':'')+'<button class="btn" id="mn" style="background:#5d6b7d">Town map</button></div>';
  $('#scrc').innerHTML=h;$('#scr').style.display='flex';
  $('#re').onclick=function(){init(G.i)};if($('#nx'))$('#nx').onclick=function(){init(G.i+1)};$('#mn').onclick=menu;
}
function menu(){
  var h='<h1>Subway God</h1><p class="small">Keep five towns moving for up to five minutes each. Avoid catastrophe, and don’t leave any neighborhood behind.</p><div class="lvs">';
  LV.forEach(function(l,i){h+='<button class="lv" data-i="'+i+'"'+(i<prog.open?'':' disabled')+'><span><b>'+(i+1)+'. '+l.n+'</b><br><span class="small">'+fmt(l.t)+(i<prog.open?'':' · locked')+'</span></span><span>'+'★'.repeat(prog.stars[i])+'☆'.repeat(3-prog.stars[i])+'</span></button>'});
  $('#scrc').innerHTML=h+'</div>';$('#scr').style.display='flex';
  [].forEach.call(document.querySelectorAll('.lv'),function(b){b.onclick=function(){init(+b.dataset.i)}});
}

// ---- input
var drag=null;
ren.domElement.addEventListener('pointerdown',function(e){drag={x:e.clientX,m:0}});
addEventListener('pointermove',function(e){if(drag&&e.buttons){var d=e.clientX-drag.x;drag.m+=Math.abs(d);drag.x=e.clientX;ang=Math.max(-1,Math.min(1,ang-d*.005))}});
ren.domElement.addEventListener('wheel',function(e){dist=Math.max(18,Math.min(42,dist+e.deltaY*.02))},{passive:true});
var rc=new T.Raycaster();
ren.domElement.addEventListener('pointerup',function(e){
  if(!G||G.over||!drag||drag.m>6){drag=null;return}drag=null;
  rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
  var hits=rc.intersectObjects(G.trains.map(function(t){return t.hit}));
  if(hits.length){var t=hits[0].object.userData.tr;if(t.down>0)fixT(t);else sw(t);suggest()}
});
function setMode(m){mode=m;$('#m-avg').setAttribute('aria-pressed',m==='avg');$('#m-fair').setAttribute('aria-pressed',m==='fair');if(G)suggest()}
$('#m-avg').onclick=function(){setMode('avg')};$('#m-fair').onclick=function(){setMode('fair')};
$('#accept').onclick=function(){apply(G.sug,false)};

// ---- render
var last=performance.now(),vp=new T.Vector3();
function frame(now){
  var dt=Math.min(.1,(now-last)/1000);last=now;var time=now/1000;
  if(G){
    if(!G.over){
      var n=Math.max(1,Math.round(dt/.05));for(var i=0;i<n;i++)step(dt/n);
      var w=waits();G.w=w;
      if(w.n>5){G.fs+=w.fair;G.fn++}
      var st=0;if(w.avg>30)st+=(w.avg-30)/30;if(w.mx>45)st+=(w.mx-45)/45;for(var id in S)if(S[id].q.length>55)st+=.4;
      G.chaos=Math.max(0,Math.min(100,G.chaos+(st*3-1.2)*dt));G.peak=Math.max(G.peak,G.chaos);
      if(G.chaos>=100)finish(false);else if(G.t>=G.lv.t)finish(true);
    }
    var w2=G.w||waits();
    // stations
    for(var id2 in S){
      var s=S[id2],o=sObj[id2],q=Math.min(s.q.length,14);
      o.people.forEach(function(p,i){p.visible=i<q&&s.closed<=0||(i<q&&s.kind==='eq'&&false);if(p.visible)p.position.y=.3+((Math.floor(time*3+i)%5===0)?.06:0)});
      o.water.visible=s.closed>0&&s.kind==='fl';if(o.water.visible)o.water.position.y=.35+Math.sin(time*3)*.05;
      o.bar.visible=s.closed>0&&s.kind!=='fl';o.cr.visible=s.closed>0&&s.kind==='eq';
      o.al.visible=s.q.length>40&&s.closed<=0;if(o.al.visible){var k=1+Math.sin(time*8)*.15;o.al.scale.set(k,k,k)}
      var d=lab[id2];d.lastChild.textContent=s.closed>0?'Closed '+Math.ceil(s.closed)+'s':s.q.length;d.classList.toggle('closed',s.closed>0);d.classList.toggle('hot',s.q.length>40&&s.closed<=0);
      vp.set(s.x,2.5,s.z).project(cam);d.style.transform='translate('+((vp.x*.5+.5)*innerWidth)+'px,'+((-vp.y*.5+.5)*innerHeight)+'px) translate(-50%,-100%)';
    }
    G.trains.forEach(function(t){
      var pts=L[t.line],j=Math.max(0,Math.min(Math.floor(t.p),pts.length-2)),f=t.p-j,a=S[pts[j]],b=S[pts[j+1]];
      t.g.position.set(a.x+(b.x-a.x)*f,.2,a.z+(b.z-a.z)*f);
      t.g.rotation.y=-Math.atan2((b.z-a.z)*t.dir,(b.x-a.x)*t.dir);
      var bad=t.down>0?1:0;if(t.vis!==bad){t.vis=bad;t.mats.forEach(function(m){m.color.setHex(bad?0x777d85:LC[t.line])});t.bc.visible=!!bad;t.smoke.forEach(function(s){s.visible=!!bad})}
      if(bad){t.bc.visible=Math.floor(time*4)%2===0;t.smoke.forEach(function(s,k){var u=(time*.8+k*.34)%1;s.position.set(-.3-u*.5,1.2+u*1.8,0);s.scale.setScalar(.6+u);s.material.opacity=.6*(1-u)})}
    });
    // hud
    $('#clock').textContent=fmt(G.lv.t-G.t);
    $('#chaos').style.width=G.chaos+'%';
    $('#crews').textContent='Repair crews: '+'●'.repeat(G.crews)+'○'.repeat(3-G.crews);
    $('#fair').textContent=Math.round(w2.fair);
    var worst=null,wv=0;
    for(var k2 in G.hist){var v=w2.by[k2];if(v>wv){wv=v;worst=k2}$('#b-'+k2).style.width=Math.min(100,v/60*100)+'%';$('#v-'+k2).textContent=Math.round(v)+'s'}
    $('#alert').textContent=(worst&&w2.avg>1&&wv>w2.avg*1.8&&wv>20)?NB[worst][0]+' waits '+(wv/w2.avg).toFixed(1)+'x longer than average.':'';
    $('#bot').className='card'+(G.chaos>80?' panic':G.chaos>55?' worry':'');
    $('#say').textContent=G.sayT>0?G.say:(G.sug?G.sug.text:'All good. Holding steady.');
    $('#accept').disabled=!G.sug;
    shake=G.quake>0?.35*G.quake/4:0;
  }
  cam.position.set(tgt.x+Math.sin(ang)*dist*.62+(Math.random()-.5)*shake,tgt.y+dist*.75+(Math.random()-.5)*shake,tgt.z+Math.cos(ang)*dist*.62);
  cam.lookAt(tgt);
  ren.render(scene,cam);requestAnimationFrame(frame);
}
menu();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
